name: Deploy MCP Worker

on:
  push:
    branches:
      - main
    paths:
      - 'mcp-server/**'
      - 'products-data.json'
      - 'ingredient-evidence.json'
      - '.github/workflows/deploy-mcp-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package.json

      - name: Install dependencies
        run: npm install

      - name: Sync bundled data snapshots
        run: npm run sync-data

      - name: Type-check MCP Worker
        run: npm run typecheck

      - name: Deploy MCP Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify MCP public endpoints
        run: |
          set -e

          check_url() {
            url="$1"
            for attempt in 1 2 3 4 5 6; do
              HTTP_CODE=$(curl -L --max-time 20 -s -o /dev/null -w "%{http_code}" "$url" || true)
              echo "$url -> HTTP $HTTP_CODE (attempt $attempt)"
              if [ "$HTTP_CODE" = "200" ]; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          check_url "https://mcp.supplement-intelligence.com/"
          check_url "https://mcp.supplement-intelligence.com/health"

          ROOT_JSON=$(curl -L --max-time 20 -s "https://mcp.supplement-intelligence.com/")
          echo "$ROOT_JSON" | grep -q '"name":"Supplement Intelligence MCP"\|"name": "Supplement Intelligence MCP"'
          echo "$ROOT_JSON" | grep -q 'search_supplement_intelligence'

          HEALTH_JSON=$(curl -L --max-time 20 -s "https://mcp.supplement-intelligence.com/health")
          echo "$HEALTH_JSON" | grep -q '"ok":true\|"ok": true'

          # MCP endpoint should reject a normal GET or return an MCP transport response,
          # but it must exist at the configured path rather than 404.
          MCP_CODE=$(curl --max-time 20 -s -o /dev/null -w "%{http_code}" "https://mcp.supplement-intelligence.com/mcp" || true)
          echo "/mcp GET -> HTTP $MCP_CODE"
          test "$MCP_CODE" != "404"

      - name: Run MCP protocol smoke test
        run: npm run smoke
        env:
          MCP_URL: https://mcp.supplement-intelligence.com/mcp
