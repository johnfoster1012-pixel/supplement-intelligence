name: Validate Plugin Package

on:
  pull_request:
    paths:
      - 'plugin-package/**'
      - '.github/workflows/validate-plugin-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("plugin-package")
          plugin = json.loads((root / "plugin.json").read_text())
          mcp = json.loads((root / "mcp.json").read_text())

          assert plugin["$schema"] == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json"
          assert plugin["name"] == "supplement-intelligence"
          assert plugin["version"] == "1.0.0"

          allowed = {
              "$schema","name","version","description","author","homepage",
              "repository","license","keywords","extensions"
          }
          unknown = set(plugin) - allowed
          assert not unknown, f"Unknown portable plugin.json fields: {sorted(unknown)}"

          assert mcp["$schema"] == "https://agent-plugins.org/schemas/1.0.0/mcp.schema.json"
          assert set(mcp) == {"$schema","mcpServers"}
          server = mcp["mcpServers"]["supplement-intelligence"]
          assert server["type"] == "streamable-http"
          assert server["url"] == "https://mcp.supplement-intelligence.com/mcp"

          skill = root / "skills" / "supplement-evidence-research" / "SKILL.md"
          dependency = root / "skills" / "supplement-evidence-research" / "agents" / "openai.yaml"
          assert skill.is_file()
          assert dependency.is_file()

          text = skill.read_text()
          assert text.startswith("---\n")
          assert "name: supplement-evidence-research" in text
          assert "description:" in text

          print("Portable plugin package structural validation passed.")
          PY

      - name: Validate production MCP server
        working-directory: mcp-server
        run: |
          npm install
          npm run smoke

      - name: Build plugin ZIP
        run: |
          cd plugin-package
          zip -r ../supplement-intelligence-plugin-v1.0.0.zip             plugin.json mcp.json skills EVALS.md README.md

      - name: Inspect ZIP contents
        run: |
          unzip -l supplement-intelligence-plugin-v1.0.0.zip
          test "$(unzip -Z1 supplement-intelligence-plugin-v1.0.0.zip | head -1)" = "plugin.json"
