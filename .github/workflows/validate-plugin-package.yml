name: Validate Plugin Package

on:
  pull_request:
    paths:
      - 'plugin-package/**'
      - 'scripts/validate_plugin_package.py'
      - 'site/support.html'
      - 'site/privacy.html'
      - 'site/terms.html'
      - 'worker.js'
      - 'sitemap.xml'
      - 'mcp-server/**'
      - '.github/workflows/validate-plugin-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate plugin package
        run: python scripts/validate_plugin_package.py

      - name: Build upload ZIP
        run: |
          cd plugin-package
          zip -r ../supplement-intelligence-plugin-v1.0.0.zip . -x '*.DS_Store'
          cd ..
          unzip -l supplement-intelligence-plugin-v1.0.0.zip

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplement-intelligence-plugin-v1.0.0
          path: supplement-intelligence-plugin-v1.0.0.zip
          if-no-files-found: error
