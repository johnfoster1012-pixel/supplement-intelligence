name: Validate MCP Worker

on:
  pull_request:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/validate-mcp-worker.yml'
      - '.github/workflows/deploy-mcp-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check MCP Worker
        run: npm run typecheck

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
