name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'product-template.html'
      - 'products-data.json'
      - 'ingredient-evidence.json'
      - 'data/**'
      - 'docs/**'
      - 'products/**'
      - 'ingredients/**'
      - 'articles/**'
      - 'site/**'
      - 'sitemap.xml'
      - 'llm.txt'
      - 'llms.txt'
      - 'robots.txt'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy and verify Worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Validate JSON and repository consistency
        run: |
          python - <<'PY'
          import json, glob
          for path in glob.glob('**/*.json', recursive=True):
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          print('JSON parse check passed')
          PY
          python parse_products.py

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          sleep 10
          set -e
          for url in             "/"             "/products"             "/ingredients"             "/ingredients/creatine-monohydrate"             "/ingredients/berberine"             "/about"             "/references"             "/llms.txt"             "/robots.txt"             "/sitemap.xml"; do
            HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "https://supplement-intelligence.com$url")
            echo "$url -> HTTP $HTTP_CODE"
            test "$HTTP_CODE" = "200"
          done

          # Retired study URLs must no longer expose their old content.
          for url in             "/database/ashwagandha-studies"             "/database/berberine-studies"             "/database/nac-studies"; do
            HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "https://supplement-intelligence.com$url")
            echo "$url -> final HTTP $HTTP_CODE"
            test "$HTTP_CODE" = "200"
          done
