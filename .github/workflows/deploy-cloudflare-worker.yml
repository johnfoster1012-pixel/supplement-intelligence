name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'product-template.html'
      - 'products-data.json'
      - 'ingredient-evidence.json'
      - 'openapi.json'
      - 'API.md'
      - 'plugin/**'
      - 'data/**'
      - 'docs/**'
      - 'products/**'
      - 'ingredients/**'
      - 'articles/**'
      - 'site/**'
      - 'sitemap.xml'
      - 'llm.txt'
      - 'llms.txt'
      - 'robots.txt'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy and verify Worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Validate JSON and repository consistency
        run: |
          python - <<'PY'
          import json, glob
          for path in glob.glob('**/*.json', recursive=True):
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          print('JSON parse check passed')
          PY
          python parse_products.py

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          set -e

          check_url() {
            url="$1"
            for attempt in 1 2 3 4 5 6; do
              HTTP_CODE=$(curl -L --max-time 20 -s -o /dev/null -w "%{http_code}" "https://supplement-intelligence.com$url" || true)
              echo "$url -> HTTP $HTTP_CODE (attempt $attempt)"
              if [ "$HTTP_CODE" = "200" ]; then
                return 0
              fi
              sleep 10
            done
            echo "Deployment verification failed for $url"
            return 1
          }

          for url in             "/"             "/products"             "/ingredients"             "/ingredients/creatine-monohydrate"             "/ingredients/berberine"             "/about"             "/references"             "/llms.txt"             "/robots.txt"             "/sitemap.xml"             "/api/v1"             "/api/v1/search?q=creatine"             "/api/v1/ingredients/creatine-monohydrate"             "/api/v1/products/performance-plus"             "/openapi.json"; do
            check_url "$url"
          done

          for url in             "/database/ashwagandha-studies"             "/database/berberine-studies"             "/database/nac-studies"; do
            check_url "$url"
          done

          API_INDEX=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/api/v1")
          echo "$API_INDEX" | grep -q '"name": "Supplement Intelligence API"'
          echo "$API_INDEX" | grep -q '"products": 31'
          echo "$API_INDEX" | grep -q '"ingredients": 26'

          SEARCH_JSON=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/api/v1/search?q=creatine")
          echo "$SEARCH_JSON" | grep -q '"query": "creatine"'
          echo "$SEARCH_JSON" | grep -q '"type": "ingredient"'

          ROOT_HTML=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/")
          echo "$ROOT_HTML" | grep -q "verification, not marketing claims"
          if echo "$ROOT_HTML" | grep -Eq '\$[0-9]+(\.[0-9]{2})?'; then
            echo "Unexpected displayed pricing found on homepage"
            exit 1
          fi
