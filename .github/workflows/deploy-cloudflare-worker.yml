name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'product-template.html'
      - 'products-data.json'
      - 'ingredient-evidence.json'
      - 'openapi.json'
      - 'API.md'
      - 'plugin/**'
      - 'data/**'
      - 'docs/**'
      - 'products/**'
      - 'ingredients/**'
      - 'glp-1/**'
      - 'peptides/**'
      - 'images/**'
      - 'articles/**'
      - 'site/**'
      - 'sitemap.xml'
      - 'llm.txt'
      - 'llms.txt'
      - 'robots.txt'
      - 'BingSiteAuth.xml'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:
    inputs:
      indexnow_urls:
        description: 'Extra paths to send to IndexNow, space-separated (e.g. /peptides /ingredients/zinc)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy and verify Worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Validate JSON and repository consistency
        run: |
          python - <<'PY'
          import json, glob
          for path in glob.glob('**/*.json', recursive=True):
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          print('JSON parse check passed')
          PY
          python parse_products.py

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy --var CONTENT_REV:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        id: verify
        run: |
          set -e

          check_url() {
            url="$1"
            for attempt in 1 2 3 4 5 6; do
              HTTP_CODE=$(curl -L --max-time 20 -s -o /dev/null -w "%{http_code}" "https://supplement-intelligence.com$url" || true)
              echo "$url -> HTTP $HTTP_CODE (attempt $attempt)"
              if [ "$HTTP_CODE" = "200" ]; then
                return 0
              fi
              sleep 10
            done
            echo "Deployment verification failed for $url"
            return 1
          }

          for url in             "/"             "/products"             "/ingredients"             "/ingredients/creatine-monohydrate"             "/ingredients/berberine"             "/ingredients/hibiscus"             "/ingredients/lemon-balm"             "/api/v1/ingredients/uva-ursi"             "/about"             "/references"             "/privacy"             "/terms"             "/support"             "/llms.txt"             "/robots.txt"             "/sitemap.xml"             "/api/v1"             "/api/v1/search?q=creatine"             "/api/v1/ingredients/creatine-monohydrate"             "/api/v1/products/performance-plus"             "/openapi.json"; do
            check_url "$url"
          done

          for url in             "/database/ashwagandha-studies"             "/database/berberine-studies"             "/database/nac-studies"; do
            check_url "$url"
          done

          API_INDEX=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/api/v1")
          echo "$API_INDEX" | grep -q '"name": "Supplement Intelligence API"'
          echo "$API_INDEX" | grep -q '"products": 39'
          echo "$API_INDEX" | grep -q '"ingredients": 37'

          SEARCH_JSON=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/api/v1/search?q=creatine")
          echo "$SEARCH_JSON" | grep -q '"query": "creatine"'
          echo "$SEARCH_JSON" | grep -q '"type": "ingredient"'

          HIBISCUS_JSON=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/api/v1/search?q=hibiscus")
          echo "$HIBISCUS_JSON" | grep -q '"slug": "hibiscus"'

          VITAREN_JSON=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/api/v1/products/v-itaren")
          echo "$VITAREN_JSON" | grep -q '"slug": "uva-ursi"'

          ROOT_HTML=$(curl -L --max-time 20 -s "https://supplement-intelligence.com/")
          echo "$ROOT_HTML" | grep -q "verification, not marketing claims"
          if echo "$ROOT_HTML" | grep -Eq '\$[0-9]+(\.[0-9]{2})?'; then
            echo "Unexpected displayed pricing found on homepage"
            exit 1
          fi

          # Status codes that must not regress: unknown URLs are real 404s (not the
          # retired homepage), retired files are 410, and duplicates redirect.
          expect_status() {
            url="$1"; want="$2"
            for attempt in 1 2 3 4 5 6; do
              HTTP_CODE=$(curl --max-time 20 -s -o /dev/null -w "%{http_code}" "$url" || true)
              echo "$url -> HTTP $HTTP_CODE, expected $want (attempt $attempt)"
              if [ "$HTTP_CODE" = "$want" ]; then
                return 0
              fi
              sleep 10
            done
            echo "Status verification failed for $url"
            return 1
          }

          expect_status "https://supplement-intelligence.com/this-page-should-not-exist" 404
          expect_status "https://supplement-intelligence.com/feed.xml" 410
          expect_status "https://supplement-intelligence.com/humans.txt" 410
          expect_status "https://supplement-intelligence.com/favicon.ico" 200
          expect_status "https://supplement-intelligence.com/ingredients/berberine/" 301
          expect_status "https://supplement-intelligence.com/about.html" 301
          expect_status "https://www.supplement-intelligence.com/ingredients" 301

          BING_XML=$(curl --max-time 20 -s "https://supplement-intelligence.com/BingSiteAuth.xml")
          echo "$BING_XML" | grep -q "<users>"

      - name: Notify IndexNow of changed pages
        if: always() && steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          INDEXNOW_KEY: '86d9c9becdf5f0b88ac95b1af8d08dbd'
          BEFORE: ${{ github.event.before }}
          EXTRA: ${{ github.event.inputs.indexnow_urls }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          key = os.environ["INDEXNOW_KEY"]
          host = "supplement-intelligence.com"
          # The key file must be live before IndexNow will accept a submission.
          live = urllib.request.urlopen(f"https://{host}/{key}.txt", timeout=20).read().decode().strip()
          assert live == key, "IndexNow key file not served"
          paths = set(p for p in os.environ.get("EXTRA", "").split() if p.startswith("/"))
          before = os.environ.get("BEFORE", "")
          if before and set(before) != {"0"}:
              changed = subprocess.run(["git", "diff", "--name-only", before, "HEAD"], capture_output=True, text=True).stdout.split()
              for f in changed:
                  top = f.split("/")[0]
                  if top in ("ingredients", "glp-1", "peptides", "articles", "products") and f.endswith(".html") and os.path.exists(f):
                      p = "/" + f[:-5]
                      if p.endswith("/index"):
                          p = p[:-6]
                      paths.add(p)
          if not paths:
              print("IndexNow: no changed pages")
              raise SystemExit(0)
          urls = sorted(f"https://{host}{p}" for p in paths)
          body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow HTTP", r.status, "for", len(urls), "URLs:", *urls, sep="\n  ")
          PY
